[cluster]
# ключ для работы клавстера gfm 
my_pub_hash = +I9IQuXYW8I=
# Ключ администратора или системы мониторинга для получения отчетов здоровья
admin_pub_hash = zpPVK9fbEqo=
quorum_total_nodes = 3
# Уникальное имя инстанса для логов и файлов
cluster_id = pg_prod_5432 

[postgresql]
# Имя системной службы (например, postgresql@17-main или custom_pg)
service_name = postgresql@17-main
# Параметры для pg_ctlcluster (версия и имя кластера)
pg_version = 17
pg_instance_name = main
# Порт (для проверок)
port = 5432

[timings]
heartbeat_interval = 15
max_missing_heartbeats = 3
monitor_interval = 300
heartbeat_ttl = 45
event_ttl = 86400
default_ttl = 3600

[paths]
base_dir = /etc/gorgona
gorgona_bin = /usr/bin/gorgona
psql_bin = /usr/bin/psql
pg_ctl_bin = /usr/bin/pg_ctlcluster
rebuild_script = /usr/local/bin/gfm_rebuild.sh
