[cluster]
# Хэш вашего ключа управления
my_pub_hash = +I9IQuXYW8I=
# Общее количество узлов в кластере (включая Witness)
quorum_total_nodes = 3

[timings]
heartbeat_interval = 15
max_missing_heartbeats = 3
monitor_interval = 180
# Пульс живет недолго, чтобы не засорять last 5
heartbeat_ttl = 45
# События (Audit Log) живут долго
event_ttl = 86400
# По умолчанию для мониторинга
default_ttl = 3600

[paths]
# Базовая директория конфигураций
base_dir = /etc/gorgona
# Путь к бинарникам
gorgona_bin = /usr/bin/gorgona
psql_bin = /usr/bin/psql
pg_ctl_bin = /usr/bin/pg_ctlcluster
# Скрипт восстановления
rebuild_script = /usr/local/bin/gfm_rebuild.sh
